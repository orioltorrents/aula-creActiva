<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Bioindicadors del riu</title>
  <desc id="desc">Il·lustració científica d'una larva de macroinvertebrat i escala cromàtica de qualitat de l'aigua</desc>
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#082f49"/>
      <stop offset="0.5" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc" stop-opacity=".98"/>
      <stop offset="1" stop-color="#e2e8f0" stop-opacity=".95"/>
    </linearGradient>
    <clipPath id="specimen-frame"><rect x="70" y="205" width="760" height="430" rx="24"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity=".35"/></filter>
  </defs>

  <rect width="1200" height="800" rx="34" fill="url(#water)"/>
  <path d="M0 625C180 545 330 590 470 650s275 77 430 8 221-77 300-30v172H0z" fill="#0f3d4f" opacity=".9"/>
  <path d="M-20 550c210-110 335-55 506 20s294 68 464-8 219-65 270-37" fill="none" stroke="#67e8f9" stroke-width="8" opacity=".28"/>
  <g opacity=".22" fill="none" stroke="#bae6fd" stroke-width="3"><path d="M30 300h180M950 245h210M890 565h250"/><path d="M80 335h90M1010 280h120"/></g>

  <g filter="url(#shadow)">
    <rect x="55" y="55" width="1090" height="115" rx="20" fill="url(#panel)"/>
    <text x="95" y="112" fill="#0f172a" font-family="Arial, sans-serif" font-size="43" font-weight="700" letter-spacing="2">BIOINDICADORS DEL RIU</text>
    <text x="98" y="145" fill="#475569" font-family="Arial, sans-serif" font-size="19" letter-spacing=".5">Macroinvertebrats com a indicadors de la qualitat de l'aigua</text>
  </g>

  <rect x="70" y="205" width="760" height="430" rx="24" fill="#f8fafc" opacity=".96" filter="url(#shadow)"/>
  <g clip-path="url(#specimen-frame)">
    <rect x="70" y="205" width="760" height="430" fill="#f8fafc"/>
    <image href="clau-macroinvertebrats/Hydropsyche.PNG" x="105" y="245" width="690" height="345" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <text x="105" y="610" fill="#475569" font-family="Arial, sans-serif" font-size="18">Exemple de macroinvertebrat aquàtic</text>

  <g filter="url(#shadow)">
    <rect x="875" y="205" width="270" height="430" rx="24" fill="url(#panel)"/>
    <text x="915" y="255" fill="#0f172a" font-family="Arial, sans-serif" font-size="21" font-weight="700">QUALITAT</text>
    <text x="915" y="284" fill="#64748b" font-family="Arial, sans-serif" font-size="16">escala de camp</text>
    <rect x="915" y="320" width="190" height="42" rx="9" fill="#2563eb"/><text x="930" y="347" fill="#fff" font-family="Arial, sans-serif" font-size="18" font-weight="700">Molt bona</text>
    <rect x="915" y="375" width="190" height="42" rx="9" fill="#16a34a"/><text x="930" y="402" fill="#fff" font-family="Arial, sans-serif" font-size="18" font-weight="700">Bona</text>
    <rect x="915" y="430" width="190" height="42" rx="9" fill="#eab308"/><text x="930" y="457" fill="#422006" font-family="Arial, sans-serif" font-size="18" font-weight="700">Moderada</text>
    <rect x="915" y="485" width="190" height="42" rx="9" fill="#f97316"/><text x="930" y="512" fill="#fff" font-family="Arial, sans-serif" font-size="18" font-weight="700">Dolenta</text>
    <rect x="915" y="540" width="190" height="42" rx="9" fill="#dc2626"/><text x="930" y="567" fill="#fff" font-family="Arial, sans-serif" font-size="18" font-weight="700">Molt dolenta</text>
  </g>
</svg>

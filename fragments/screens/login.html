<section id="login-screen" class="screen active">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1 data-i18n="login_title">Aula CreActiva</h1>
                <p data-i18n="login_subtitle">Accés a l'Entorn d'Aprenentatge</p>
            </div>
            <form id="login-form">
                <div class="form-group">
                    <label for="email" data-i18n="label_email">Correu electrònic</label>
                    <input type="email" id="email" placeholder="alumne@escola.cat" required>
                </div>
                <div class="form-group">
                    <label for="password" data-i18n="label_password">Contrasenya</label>
                    <input type="password" id="password" placeholder="••••••" required>
                </div>
                <button type="submit" class="btn btn--primary" id="login-btn">
                    <span class="btn-text" data-i18n="btn_login">Entrar</span>
                    <div class="loader hidden" id="login-loader"></div>
                </button>
                <p id="login-error" class="error-msg"></p>
            </form>
            <details>
                <summary>He oblidat la contrasenya</summary>
                <form id="password-reset-request-form">
                    <div class="form-group">
                        <label for="password-reset-email">Correu del compte</label>
                        <input id="password-reset-email" name="email" type="email" autocomplete="email" required>
                    </div>
                    <button type="submit" class="btn btn--secondary">Envia’m un codi</button>
                    <p role="status"></p>
                </form>
                <form id="password-reset-form">
                    <div class="form-group">
                        <label for="password-reset-code">Codi rebut per correu</label>
                        <input id="password-reset-code" name="code" type="text" autocomplete="one-time-code" required>
                    </div>
                    <div class="form-group">
                        <label for="password-reset-new">Contrasenya nova (mínim 12 caràcters)</label>
                        <input id="password-reset-new" name="newPassword" type="password" autocomplete="new-password" minlength="12" required>
                    </div>
                    <button type="submit" class="btn btn--primary">Restableix la contrasenya</button>
                    <p role="status"></p>
                </form>
            </details>
        </div>
    </div>
</section>

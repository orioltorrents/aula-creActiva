    <section id="game-screen" class="screen hidden">
        <header class="top-bar">
            <div class="game-back-actions">
                <button id="back-menu-btn" class="btn btn--secondary game-back-button hidden" type="button"
                    aria-label="Tornar al menú anterior" title="Tornar al menú anterior">
                    <span class="game-back-button__icon" aria-hidden="true">‹</span>
                </button>
                <button id="back-dashboard-btn" class="btn btn--secondary game-back-button" type="button"
                    aria-label="Tornar al menú principal" title="Tornar al menú principal">
                    <span class="game-back-button__icon" aria-hidden="true">«</span>
                </button>
            </div>
            <div class="top-bar__identity">
                <div id="game-title" class="title">Activitat</div>
            </div>
            <div class="top-bar__actions">
                <div id="game-user-name" class="top-bar__user-name hidden"></div>
                <button id="fullscreen-btn" class="btn btn--secondary" title="Pantalla completa">⛶</button>
            </div>
        </header>
        <main class="game-content">
            <div class="game-container">
                <!-- Aquí aniria l'iframe o el canvas del joc -->
                <div id="activity-area">

                    <!-- SIMULADOR GENÈRIC (Per a altres projectes) -->
                    <div id="game-container-generic" class="game-module hidden">
                        <h3>Simulació Genèrica (Mode Examen)</h3>
                        <p>Aquest projecte encara no té activitats específiques.</p>
                        <button id="simulate-score-btn" class="btn btn--primary">Simular Finalització (Test)</button>
                        <p id="simulation-result"></p>
                    </div>
                </div>
            </div>
        </main>
    </section>
